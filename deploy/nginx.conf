# 拾光小栈 · Nginx 配置模板
# 用法：上传到服务器 /etc/nginx/sites-available/blog 并启用
# 详细步骤见 docs/部署到云服务器.md

server {
    listen 80;
    server_name _;              # 有域名后改成：server_name 你的域名;

    root /var/www/blog;         # 网站文件目录（dist 上传到这里）
    index index.html;

    # ★ 单页应用（SPA）必备：所有前端路由都回退到 index.html
    # 没有这行，直接访问 /posts/xxx 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源（js/css）可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 开启 gzip 压缩，页面加载更快
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
