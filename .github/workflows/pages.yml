# ============================================
# GitHub Pages 自动部署（免费托管，无需云服务器）
# 每次 push 到 main：自动构建 → 发布到 GitHub Pages
# 访问地址：https://eebolg.online（已绑定自定义域名）
#
# 前提：仓库 Settings → Pages → Source 选择「GitHub Actions」
# ============================================

name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的 push 会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
